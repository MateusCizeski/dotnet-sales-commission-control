name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Needs ApiBase 3.0.0 on nuget.org: this job fails until the package is published.
      - name: Restore
        run: dotnet restore Portal.slnx

      - name: Build
        run: dotnet build Portal.slnx -c Release --no-restore

      - name: Unit tests
        run: dotnet test Tests/Tests.Unit/Tests.Unit.csproj -c Release --no-build

      - name: Integration tests
        run: dotnet test Tests/Tests.Integration/Tests.Integration.csproj -c Release --no-build

      - name: Vulnerable packages
        run: dotnet list Portal.slnx package --vulnerable --include-transitive

      - name: Docker images
        run: |
          docker build -f Api/dockerfile -t sales-api .
          docker build -f Front/dockerfile -t sales-front .
